[project]
name = "guitarvis"
version = "0.1.0"
description = "Audio to guitar tablature, with synced play-along views."
requires-python = ">=3.12"
dependencies = [
    "guitarvis-core",
    "guitarvis-api",
    "guitarvis-worker",
    "guitarvis-eval",
]

[tool.uv]
package = false
# ADR 0006. basic-pitch pins tensorflow<2.15.1 unconditionally on Linux at
# Python >= 3.11, and no cp312 wheel of that tensorflow exists. We run its
# bundled ONNX model through onnxruntime instead, so the requirement is
# overridden away with a marker that never matches. The resampy override is a
# second, independent 3.12 break: basic-pitch pins resampy<0.4.3, and those
# versions import pkg_resources, which setuptools >= 81 no longer ships.
override-dependencies = [
    "tensorflow; sys_platform == 'never'",
    "tensorflow-macos; sys_platform == 'never'",
    "resampy>=0.4.3",
]

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker", "apps/eval"]

[tool.uv.sources]
guitarvis-core = { workspace = true }
guitarvis-api = { workspace = true }
guitarvis-worker = { workspace = true }
guitarvis-eval = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-q"
