[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
; ignore_missing_imports intentionally NOT set (mypy defaults it to False).
; The blanket flag used to be on here, which suppressed every dependency's
; missing type information indiscriminately — including a missing py.typed
; marker on one of this workspace's own packages, a mistake a reviewer had to
; find by hand. Verified clean without it across every package + test tree in
; PY_SOURCES; every third-party dependency here (pydantic, fastapi) ships its
; own py.typed. If a genuinely untyped dependency is added later, ignore it by
; name in a `[mypy-<module>]` section rather than turning this back on
; globally.

; Strict where the contract lives. Everything else stays lenient so that
; exploratory pipeline code is not fought with type errors during phase 1.
;
; mypy's `strict` is a command-line flag only and cannot be set per module, so
; the contract modules name the individual flags it implies.
[mypy-guitarvis_core.tabdoc]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
no_implicit_optional = True
warn_return_any = True
strict_equality = True

[mypy-guitarvis_core.contracts]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
no_implicit_optional = True
warn_return_any = True
strict_equality = True

[mypy-guitarvis_core.fretboard]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
no_implicit_optional = True
warn_return_any = True
strict_equality = True
