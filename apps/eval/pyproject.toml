[project]
name = "guitarvis-eval"
version = "0.1.0"
description = "GuitarSet evaluation harness. Measured, never gated."
requires-python = ">=3.12"
dependencies = ["guitarvis-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guitarvis_eval"]
